<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>لوحة التحكم — Elzzaim</title>
<meta name="theme-color" content="#08080A">
<link rel="icon" href="/img/icon-192.png">
<link rel="stylesheet" href="/style.css">
<style>
.page{padding-top:80px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px}
.st{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.st b{display:block;font-size:26px;font-weight:900;line-height:1.2}
.st span{font-size:12px;color:var(--mut);font-weight:700}
.list{display:flex;flex-direction:column;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px}
.it-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.it h4{font-size:15px;font-weight:900;line-height:1.4}
.meta{font-size:12.5px;color:var(--mut);font-weight:700}
.pill{display:inline-block;font-size:11.5px;font-weight:900;padding:3px 10px;border-radius:20px;white-space:nowrap}
.s-new{background:rgba(243,154,30,.16);color:#ffb54d}.s-confirmed{background:rgba(59,130,246,.16);color:#7fb0ff}
.s-shipped{background:rgba(168,85,247,.16);color:#c79bff}.s-delivered{background:rgba(74,222,128,.14);color:#4ADE80}.s-cancelled{background:rgba(255,255,255,.08);color:var(--mut)}
.prow{display:flex;gap:12px;align-items:center}
.thumb{width:60px;height:60px;border-radius:12px;object-fit:cover;background:#1b1b21;flex:none}
.sheet{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.sheet.on{opacity:1;pointer-events:auto}
.sheet-in{width:100%;max-width:640px;max-height:92svh;overflow:auto;background:#101014;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(24px + var(--safe));transform:translateY(40px);transition:transform .4s var(--ease)}
.sheet.on .sheet-in{transform:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;font-weight:700;font-size:14px}
.sw input{width:46px;height:26px;appearance:none;border-radius:20px;background:#333;position:relative;cursor:pointer;transition:.25s;flex:none}
.sw input:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked{background:var(--red)}
.sw input:checked:after{inset-inline-start:23px}
.imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.imgs .x{position:relative;width:78px;height:78px}
.imgs .x img{width:100%;height:100%;object-fit:cover;border-radius:12px}
.imgs .x button{position:absolute;top:-6px;inset-inline-end:-6px;width:24px;height:24px;border-radius:50%;background:var(--red);font-weight:900;font-size:13px}
.imgs .up{width:78px;height:78px;border-radius:12px;border:1.5px dashed var(--line2);display:grid;place-items:center;font-size:26px;color:var(--mut);cursor:pointer}
.login{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .glass{width:100%;max-width:380px;padding:26px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:300px;overflow:auto;margin-top:8px}
.dgrid label{margin:0;display:flex;align-items:center;gap:6px;font-size:12px}
.dgrid input{height:38px;padding:0 8px;font-size:13px}
.mini{font-size:12px;color:var(--mut);margin-top:4px}
@media (min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}.sheet{align-items:center}.sheet-in{border-radius:24px}}
</style>
</head>
<body>
<div class="glow"></div>
<header class="bar"><a class="logo" href="/" dir="ltr"><img src="/img/logo.png" alt="" width="36" height="36"><span>EL<b>ZZAIM</b></span></a>
  <div class="bar-act"><a class="ib" href="/" target="_blank" title="الموقع">↗</a><button class="ib" id="out" title="خروج" hidden>⎋</button></div></header>
<main id="app"></main>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = $("#app");
let token = (() => { try { return localStorage.getItem("elz_admin") || ""; } catch { return ""; } })();
const fmt = n => Number(n || 0).toLocaleString("en-US") + " دج";
const ST = { new: "جديد", confirmed: "مؤكد", shipped: "تم الشحن", delivered: "تم التسليم", cancelled: "ملغى" };
const WILAYAS = ["أدرار","الشلف","الأغواط","أم البواقي","باتنة","بجاية","بسكرة","بشار","البليدة","البويرة","تمنراست","تبسة","تلمسان","تيارت","تيزي وزو","الجزائر","الجلفة","جيجل","سطيف","سعيدة","سكيكدة","سيدي بلعباس","عنابة","قالمة","قسنطينة","المدية","مستغانم","المسيلة","معسكر","ورقلة","وهران","البيض","إليزي","برج بوعريريج","بومرداس","الطارف","تندوف","تيسمسيلت","الوادي","خنشلة","سوق أهراس","تيبازة","ميلة","عين الدفلى","النعامة","عين تموشنت","غرداية","غليزان","تيميمون","برج باجي مختار","أولاد جلال","بني عباس","عين صالح","عين قزام","تقرت","جانت","المغير","المنيعة"];
let CATS = [], tab = "orders", oFilter = "new";

function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200); }
async function api(path, opts = {}) {
  const r = await fetch("/api/admin" + path, { ...opts, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token } });
  if (r.status === 401) { logout(); throw new Error("auth"); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "http");
  return j;
}
const send = (path, method, body) => api(path, { method, body: JSON.stringify(body) });
function logout() { token = ""; try { localStorage.removeItem("elz_admin"); } catch {} $("#out").hidden = true; login(); }
$("#out").onclick = logout;

function login() {
  app.innerHTML = `<div class="login"><form class="glass" id="lf"><div style="text-align:center;margin-bottom:16px"><img src="/img/logo.png" style="width:80px;height:80px;border-radius:50%;margin:0 auto 10px"><h1 class="h2" style="font-size:24px">لوحة التحكم</h1></div>
    <label>كلمة السر</label><input class="in" type="password" name="p" autocomplete="current-password" required>
    <button class="btn r full" style="margin-top:14px">دخول</button></form></div>`;
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    const r = await fetch("/api/admin/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ password: e.target.p.value }) });
    if (!r.ok) return toast(r.status === 429 ? "محاولات كثيرة، انتظر قليلاً" : "كلمة السر خاطئة");
    token = (await r.json()).token; try { localStorage.setItem("elz_admin", token); } catch {}
    main();
  };
}

async function main() {
  $("#out").hidden = false;
  app.innerHTML = `<section class="page"><div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="tabs">${[["orders", "📦 الطلبات"], ["products", "🛍 المنتجات"], ["ads", "📢 الإعلانات"], ["cats", "🏷 الأصناف"], ["services", "🛠 الخدمات"], ["settings", "⚙️ الإعدادات"]].map(([k, t]) => `<button class="chip ${tab === k ? "on" : ""}" data-tab="${k}">${t}</button>`).join("")}</div>
    <div id="body"></div></div></section>`;
  $$("[data-tab]").forEach(b => b.onclick = () => { tab = b.dataset.tab; $$("[data-tab]").forEach(x => x.classList.toggle("on", x === b)); paint(); });
  try { CATS = await api("/categories"); } catch { return; }
  stats(); paint();
}
async function stats() {
  const s = await api("/stats").catch(() => null); if (!s) return;
  $("#stats").innerHTML = `<div class="st"><b style="color:var(--org)">${s.new_orders}</b><span>طلبات جديدة</span></div><div class="st"><b>${s.month_orders}</b><span>طلبات هذا الشهر</span></div>
    <div class="st"><b>${fmt(s.month_sales)}</b><span>مبيعات مُسلّمة (الشهر)</span></div><div class="st"><b>${s.products}</b><span>منتج${s.low_stock ? ` · <span style="color:#ff6b6b">${s.low_stock} مخزون منخفض</span>` : ""}</span></div>`;
}
function paint() { ({ orders, products, ads, cats, services, settings })[tab](); }

/* ---------- طلبات ---------- */
async function orders() {
  const b = $("#body");
  b.innerHTML = `<div class="chips" style="margin:0 -20px 6px">${[["new", "جديد"], ["confirmed", "مؤكد"], ["shipped", "تم الشحن"], ["delivered", "تم التسليم"], ["cancelled", "ملغى"], ["all", "الكل"]].map(([k, t]) => `<button class="chip ${oFilter === k ? "on" : ""}" data-f="${k}">${t}</button>`).join("")}</div><div class="list" id="ol"><div class="skel" style="height:120px"></div></div>`;
  $$("[data-f]").forEach(x => x.onclick = () => { oFilter = x.dataset.f; orders(); });
  const list = await api("/orders?status=" + oFilter).catch(() => []);
  const intl = p => "213" + String(p).replace(/^0/, "");
  $("#ol").innerHTML = list.length ? list.map(o => `<div class="it">
    <div class="it-h"><div><h4>#${o.id} — ${esc(o.name)}</h4><div class="meta"><a class="ltr" href="tel:${esc(o.phone)}">${esc(o.phone)}</a> · ${esc(o.wilaya)}${o.commune ? " · " + esc(o.commune) : ""}</div>
      ${o.address ? `<div class="meta">📍 ${esc(o.address)}</div>` : ""}<div class="meta">${new Date(o.created_at).toLocaleString("fr-DZ", { dateStyle: "short", timeStyle: "short" })}</div></div>
      <span class="pill s-${o.status}">${ST[o.status]}</span></div>
    <div style="margin:10px 0;padding:10px 0;border-block:1px solid var(--line);font-size:13.5px">${o.items.map(i => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${esc(i.name)} × ${i.qty}</span><b>${fmt(i.price * i.qty)}</b></div>`).join("")}
      ${o.delivery ? `<div class="meta" style="display:flex;justify-content:space-between"><span>التوصيل</span><span>${fmt(o.delivery)}</span></div>` : ""}
      <div style="display:flex;justify-content:space-between;font-weight:900;margin-top:4px"><span>المجموع</span><span style="color:var(--org)">${fmt(o.total)}</span></div>
      ${o.note ? `<div class="meta" style="margin-top:6px">📝 ${esc(o.note)}</div>` : ""}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <select class="sel" data-st="${o.id}">${Object.entries(ST).map(([k, t]) => `<option value="${k}" ${k === o.status ? "selected" : ""}>${t}</option>`).join("")}</select>
      <a class="btn wa sm" target="_blank" rel="noopener" href="https://wa.me/${intl(o.phone)}?text=${encodeURIComponent(`السلام عليكم ${o.name}، معك Elzzaim Telecom بخصوص طلبك رقم #${o.id} بمبلغ ${fmt(o.total)}.`)}">واتساب</a>
      <a class="btn l sm" href="tel:${esc(o.phone)}">📞</a>
      <button class="btn l sm" data-del="${o.id}" style="margin-inline-start:auto">🗑</button></div></div>`).join("") : `<div class="empty">لا توجد طلبات هنا</div>`;
  $$("[data-st]").forEach(s => s.onchange = async () => { await send("/orders/" + s.dataset.st, "PATCH", { status: s.value }).catch(() => toast("خطأ")); toast("تم التحديث ✓"); stats(); orders(); });
  $$("[data-del]").forEach(x => x.onclick = async () => { if (!confirm("حذف الطلب نهائياً؟")) return; await send("/orders/" + x.dataset.del, "DELETE", {}); stats(); orders(); });
}

/* ---------- منتجات ---------- */
async function products() {
  const b = $("#body");
  b.innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn r" id="newP" style="flex:1">＋ إضافة منتج</button></div>
    <label class="search" style="margin-bottom:12px"><input id="pq" placeholder="بحث…"></label><div class="list" id="pl"></div>`;
  const list = await api("/products").catch(() => []);
  const draw = (f = "") => {
    const l = list.filter(p => !f || (p.name_ar + " " + p.name_fr).toLowerCase().includes(f.toLowerCase()));
    $("#pl").innerHTML = l.length ? l.map(p => `<div class="it prow" data-e="${p.id}" style="cursor:pointer">
      ${p.images[0] ? `<img class="thumb" src="${esc(p.images[0])}">` : `<div class="thumb"></div>`}
      <div style="flex:1;min-width:0"><h4>${esc(p.name_ar)}</h4><div class="meta">${fmt(p.price)} · ${(CATS.find(c => c.id === p.category_id) || {}).name_ar || "بدون صنف"}</div>
      <div class="meta">${p.stock === null ? "مخزون غير محدود" : `المخزون: <b style="color:${p.stock <= 2 ? "#ff6b6b" : "inherit"}">${p.stock}</b>`}${p.featured ? " · ⭐ مميز" : ""}${p.active ? "" : " · 🙈 مخفي"}</div></div></div>`).join("") : `<div class="empty">لا توجد منتجات بعد — أضف أول منتج 👆</div>`;
    $$("[data-e]").forEach(x => x.onclick = () => editProduct(list.find(p => p.id === +x.dataset.e)));
  };
  draw();
  $("#pq").oninput = e => draw(e.target.value);
  $("#newP").onclick = () => editProduct(null);
}
function sheet(html) { $("#sheetIn").innerHTML = html; $("#sheet").classList.add("on"); document.body.style.overflow = "hidden"; }
function closeSheet() { $("#sheet").classList.remove("on"); document.body.style.overflow = ""; }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet") closeSheet(); });

/* ضغط الصورة في الهاتف قبل الرفع */
function compress(file, max = 1200) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let d = c.toDataURL("image/webp", .82); if (!d.startsWith("data:image/webp")) d = c.toDataURL("image/jpeg", .85);
      res(d);
    };
    img.onerror = rej; img.src = url;
  });
}
function pickImages(multiple, cb) {
  const f = $("#file"); f.multiple = multiple; f.value = "";
  f.onchange = async () => {
    for (const file of [...f.files].slice(0, 8)) {
      try { toast("جارٍ رفع الصورة…"); const data = await compress(file); const r = await send("/upload", "POST", { data }); cb(r.url); }
      catch { toast("تعذّر رفع الصورة"); }
    }
  };
  f.click();
}

function editProduct(p) {
  const x = p || { name_ar: "", name_fr: "", desc_ar: "", desc_fr: "", price: "", old_price: "", stock: "", images: [], active: true, featured: false, category_id: CATS[0] && CATS[0].id };
  let imgs = [...(x.images || [])];
  sheet(`<form id="pf"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="h2" style="font-size:20px">${p ? "تعديل المنتج" : "منتج جديد"}</h3><button type="button" class="ib" id="cx">✕</button></div>
    <label>الصور (الأولى هي الرئيسية)</label><div class="imgs" id="imgs"></div>
    <label>الاسم بالعربية *</label><input class="in" name="name_ar" value="${esc(x.name_ar)}" required>
    <label>الاسم بالفرنسية</label><input class="in" name="name_fr" value="${esc(x.name_fr)}" dir="ltr">
    <div class="row2"><div><label>السعر (دج) *</label><input class="in" name="price" type="number" inputmode="numeric" min="0" value="${esc(x.price)}" required></div>
      <div><label>السعر القديم (تخفيض)</label><input class="in" name="old_price" type="number" inputmode="numeric" min="0" value="${esc(x.old_price ?? "")}"></div></div>
    <div class="row2"><div><label>الصنف</label><select class="in" name="category_id"><option value="">بدون</option>${CATS.map(c => `<option value="${c.id}" ${c.id === x.category_id ? "selected" : ""}>${esc(c.name_ar)}</option>`).join("")}</select></div>
      <div><label>المخزون</label><input class="in" name="stock" type="number" inputmode="numeric" min="0" placeholder="فارغ = غير محدود" value="${esc(x.stock ?? "")}"></div></div>
    <label>الوصف بالعربية</label><textarea class="in" name="desc_ar">${esc(x.desc_ar)}</textarea>
    <label>الوصف بالفرنسية</label><textarea class="in" name="desc_fr" dir="ltr">${esc(x.desc_fr)}</textarea>
    <div class="sw">ظاهر في الموقع<input type="checkbox" name="active" ${x.active ? "checked" : ""}></div>
    <div class="sw">⭐ منتج مميز (يظهر في الرئيسية)<input type="checkbox" name="featured" ${x.featured ? "checked" : ""}></div>
    <button class="btn r full" style="margin-top:10px">حفظ</button>
    ${p ? `<button type="button" class="btn l full" style="margin-top:8px;color:#ff6b6b" id="delP">حذف المنتج</button>` : ""}</form>`);
  const drawImgs = () => {
    $("#imgs").innerHTML = imgs.map((u, i) => `<div class="x"><img src="${esc(u)}"><button type="button" data-ri="${i}">✕</button></div>`).join("") + `<div class="up" id="addImg">＋</div>`;
    $$("[data-ri]").forEach(b => b.onclick = () => { imgs.splice(+b.dataset.ri, 1); drawImgs(); });
    $("#addImg").onclick = () => pickImages(true, u => { imgs.push(u); drawImgs(); });
  };
  drawImgs();
  $("#cx").onclick = closeSheet;
  if (p) $("#delP").onclick = async () => { if (!confirm("حذف المنتج؟")) return; await send("/products/" + p.id, "DELETE", {}); closeSheet(); toast("تم الحذف"); stats(); products(); };
  $("#pf").onsubmit = async e => {
    e.preventDefault();
    const f = e.target, body = { name_ar: f.name_ar.value, name_fr: f.name_fr.value, desc_ar: f.desc_ar.value, desc_fr: f.desc_fr.value, price: f.price.value, old_price: f.old_price.value,
      stock: f.stock.value, category_id: f.category_id.value, images: imgs, active: f.active.checked, featured: f.featured.checked };
    try { await send(p ? "/products/" + p.id : "/products", p ? "PUT" : "POST", body); closeSheet(); toast("تم الحفظ ✓"); stats(); products(); }
    catch { toast("تحقق من الاسم والسعر"); }
  };
}

/* ---------- إعلانات ---------- */
async function ads() {
  const s = await api("/settings").catch(() => null); if (!s) return;
  let list = (s.ads || []).map(a => ({ ...a }));
  const draw = () => {
    $("#body").innerHTML = `<div class="glass" style="padding:14px;margin-bottom:12px;font-size:13.5px;line-height:1.8">
      📐 الإعلان صورة <b>أفقية بمقاس 16:9</b> (مثلاً 1600×900). تظهر في أعلى الصفحة الرئيسية تحت الواجهة مباشرة، وإذا فعّلت أكثر من إعلان تتبدّل تلقائياً كل 5 ثوانٍ.<br>
      💡 عند توليدها بالذكاء الاصطناعي أضف للبرومبت: <span dir="ltr" style="color:var(--org)">16:9 horizontal banner</span></div>
      <button class="btn r full" id="addAd" ${list.length >= 6 ? "disabled" : ""}>＋ إضافة إعلان (${list.length}/6)</button>
      <div class="list" style="margin-top:12px">${list.map((a, i) => `<div class="it">
        <img src="${esc(a.image)}" style="width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px">
        <div class="sw">ظاهر في الموقع<input type="checkbox" data-act="${i}" ${a.active ? "checked" : ""}></div>
        <label style="margin-top:0">رابط عند الضغط (اختياري)</label><input class="in" dir="ltr" data-link="${i}" value="${esc(a.link)}" placeholder="#/shop?cat=montres  أو  https://wa.me/213...">
        <div style="display:flex;gap:6px;margin-top:10px">${i ? `<button class="btn l sm" data-up="${i}">⬆ تقديم</button>` : ""}<button class="btn l sm" data-chg="${i}">↻ تغيير الصورة</button><button class="btn l sm" data-del="${i}" style="margin-inline-start:auto;color:#ff6b6b">🗑 حذف</button></div></div>`).join("")}</div>
      ${list.length ? `<button class="btn r full" id="saveAds" style="margin-top:14px">حفظ الإعلانات</button>` : `<div class="empty">لا توجد إعلانات — قسم الإعلان مخفي في الموقع</div>`}`;
    $("#addAd").onclick = () => pickImages(false, u => { list.push({ image: u, link: "", active: true }); save(); });
    $$("[data-act]").forEach(x => x.onchange = () => list[+x.dataset.act].active = x.checked);
    $$("[data-link]").forEach(x => x.oninput = () => list[+x.dataset.link].link = x.value.trim());
    $$("[data-del]").forEach(x => x.onclick = () => { if (confirm("حذف الإعلان؟")) { list.splice(+x.dataset.del, 1); save(); } });
    $$("[data-up]").forEach(x => x.onclick = () => { const i = +x.dataset.up; [list[i - 1], list[i]] = [list[i], list[i - 1]]; draw(); });
    $$("[data-chg]").forEach(x => x.onclick = () => pickImages(false, u => { list[+x.dataset.chg].image = u; draw(); }));
    const sv = $("#saveAds"); if (sv) sv.onclick = save;
  };
  const save = async () => { try { const r = await send("/settings", "PUT", { ads: list }); list = r.ads; toast("تم الحفظ ✓"); draw(); } catch { toast("خطأ"); } };
  draw();
}

/* ---------- أصناف ---------- */
async function cats() {
  CATS = await api("/categories").catch(() => CATS);
  $("#body").innerHTML = `<button class="btn r full" id="newC" style="margin-bottom:12px">＋ صنف جديد</button><div class="list">${CATS.map(c => `<div class="it prow" data-c="${c.id}" style="cursor:pointer">
    <img class="thumb" src="${esc(c.image)}"><div style="flex:1"><h4>${esc(c.name_ar)} <span class="meta">${esc(c.name_fr)}</span></h4><div class="meta">${esc(c.word)} · ${c.count} منتج${c.active ? "" : " · 🙈 مخفي"}</div></div></div>`).join("")}</div>`;
  $$("[data-c]").forEach(x => x.onclick = () => editCat(CATS.find(c => c.id === +x.dataset.c)));
  $("#newC").onclick = () => editCat(null);
}
function editCat(c) {
  const x = c || { name_ar: "", name_fr: "", word: "", image: "/img/shop.webp", sort: CATS.length, active: true };
  let image = x.image;
  sheet(`<form id="cf"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="h2" style="font-size:20px">${c ? "تعديل الصنف" : "صنف جديد"}</h3><button type="button" class="ib" id="cx">✕</button></div>
    <label>الصورة</label><div class="imgs"><div class="x"><img id="ci" src="${esc(image)}"></div><div class="up" id="chg">↻</div></div>
    <label>الاسم بالعربية *</label><input class="in" name="name_ar" value="${esc(x.name_ar)}" required>
    <label>الاسم بالفرنسية</label><input class="in" name="name_fr" value="${esc(x.name_fr)}" dir="ltr">
    <div class="row2"><div><label>الكلمة الكبيرة (لاتينية)</label><input class="in" name="word" value="${esc(x.word)}" dir="ltr" maxlength="12"></div>
    <div><label>الترتيب</label><input class="in" name="sort" type="number" value="${esc(x.sort)}"></div></div>
    <div class="sw">ظاهر في الموقع<input type="checkbox" name="active" ${x.active ? "checked" : ""}></div>
    <button class="btn r full" style="margin-top:10px">حفظ</button>
    ${c ? `<button type="button" class="btn l full" style="margin-top:8px;color:#ff6b6b" id="delC">حذف الصنف</button>` : ""}</form>`);
  $("#cx").onclick = closeSheet;
  $("#chg").onclick = () => pickImages(false, u => { image = u; $("#ci").src = u; });
  if (c) $("#delC").onclick = async () => { if (!confirm("حذف الصنف؟ المنتجات تبقى بدون صنف.")) return; await send("/categories/" + c.id, "DELETE", {}); closeSheet(); cats(); };
  $("#cf").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const body = { name_ar: f.name_ar.value, name_fr: f.name_fr.value, word: f.word.value, sort: f.sort.value, active: f.active.checked, image };
    try { await send(c ? "/categories/" + c.id : "/categories", c ? "PUT" : "POST", body); closeSheet(); toast("تم الحفظ ✓"); cats(); } catch { toast("خطأ"); }
  };
}

/* ---------- خدمات ---------- */
async function services() {
  const list = await api("/services").catch(() => []);
  const grp = k => list.filter(s => s.kind === k).map(s => `<div class="it prow" data-s="${s.id}" style="cursor:pointer"><span style="font-size:24px">${esc(s.icon)}</span><div style="flex:1"><h4>${esc(s.name_ar)}</h4><div class="meta">${esc(s.name_fr)}${s.active ? "" : " · 🙈 مخفي"}</div></div></div>`).join("");
  $("#body").innerHTML = `<button class="btn r full" id="newS" style="margin-bottom:12px">＋ خدمة جديدة</button>
    <h3 style="margin:6px 0 8px">🛠 التصليح</h3><div class="list">${grp("repair")}</div><h3 style="margin:18px 0 8px">📶 فليكسي والاتصالات</h3><div class="list">${grp("flexy")}</div>`;
  $$("[data-s]").forEach(x => x.onclick = () => editSrv(list.find(s => s.id === +x.dataset.s)));
  $("#newS").onclick = () => editSrv(null);
}
function editSrv(s) {
  const x = s || { kind: "repair", icon: "🛠", name_ar: "", name_fr: "", sort: 50, active: true };
  sheet(`<form id="sf"><div style="display:flex;justify-content:space-between;align-items:center"><h3 class="h2" style="font-size:20px">${s ? "تعديل الخدمة" : "خدمة جديدة"}</h3><button type="button" class="ib" id="cx">✕</button></div>
    <div class="row2"><div><label>النوع</label><select class="in" name="kind"><option value="repair" ${x.kind === "repair" ? "selected" : ""}>تصليح</option><option value="flexy" ${x.kind === "flexy" ? "selected" : ""}>فليكسي/اتصالات</option></select></div>
    <div><label>الرمز (إيموجي)</label><input class="in" name="icon" value="${esc(x.icon)}"></div></div>
    <label>الاسم بالعربية *</label><input class="in" name="name_ar" value="${esc(x.name_ar)}" required>
    <label>الاسم بالفرنسية</label><input class="in" name="name_fr" value="${esc(x.name_fr)}" dir="ltr">
    <label>الترتيب</label><input class="in" name="sort" type="number" value="${esc(x.sort)}">
    <div class="sw">ظاهر في الموقع<input type="checkbox" name="active" ${x.active ? "checked" : ""}></div>
    <button class="btn r full" style="margin-top:10px">حفظ</button>
    ${s ? `<button type="button" class="btn l full" style="margin-top:8px;color:#ff6b6b" id="delS">حذف</button>` : ""}</form>`);
  $("#cx").onclick = closeSheet;
  if (s) $("#delS").onclick = async () => { if (!confirm("حذف الخدمة؟")) return; await send("/services/" + s.id, "DELETE", {}); closeSheet(); services(); };
  $("#sf").onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const body = { kind: f.kind.value, icon: f.icon.value, name_ar: f.name_ar.value, name_fr: f.name_fr.value, sort: f.sort.value, active: f.active.checked };
    try { await send(s ? "/services/" + s.id : "/services", s ? "PUT" : "POST", body); closeSheet(); toast("تم الحفظ ✓"); services(); } catch { toast("خطأ"); }
  };
}

/* ---------- إعدادات ---------- */
async function settings() {
  const s = await api("/settings").catch(() => null); if (!s) return;
  const d = s.delivery || { enabled: false, default_price: 0, prices: {} };
  const fld = (k, t, dir = "") => `<label>${t}</label><input class="in" name="${k}" value="${esc(s[k] ?? "")}" ${dir ? `dir="${dir}"` : ""}>`;
  $("#body").innerHTML = `<form id="setf" class="glass" style="padding:16px">
    <h3>📞 التواصل</h3>
    ${fld("phone", "رقم الهاتف", "ltr")}${fld("whatsapp", "رقم الواتساب", "ltr")}${fld("facebook", "رابط فيسبوك", "ltr")}${fld("instagram", "رابط إنستغرام", "ltr")}${fld("tiktok", "رابط تيك توك", "ltr")}
    <h3 style="margin-top:20px">📍 المحل</h3>
    ${fld("maps", "رابط Google Maps", "ltr")}<div class="row2">${fld("lat", "خط العرض", "ltr")}${fld("lng", "خط الطول", "ltr")}</div>
    <div class="row2">${fld("city_ar", "المدينة (ع)")}${fld("city_fr", "Ville (fr)", "ltr")}</div>
    <div class="row2">${fld("days_ar", "أيام العمل (ع)")}${fld("days_fr", "Jours (fr)", "ltr")}</div>
    <div class="row2">${fld("hours_ar", "الساعات (ع) — اتركه فارغاً لإخفائه")}${fld("hours_fr", "Horaires (fr)", "ltr")}</div>
    <h3 style="margin-top:20px">📝 شريط نصي أعلى الصفحة (اختياري)</h3>
    ${fld("announce_ar", "الإعلان بالعربية")}${fld("announce_fr", "Annonce (fr)", "ltr")}
    <h3 style="margin-top:20px">🚚 أسعار التوصيل</h3>
    <div class="sw">تفعيل أسعار التوصيل في الموقع<input type="checkbox" id="den" ${d.enabled ? "checked" : ""}></div>
    <p class="mini">عند الإيقاف يظهر للزبون «يُحدَّد عند التأكيد».</p>
    <label>السعر الافتراضي (دج) — لأي ولاية بلا سعر</label><input class="in" id="ddef" type="number" inputmode="numeric" value="${esc(d.default_price)}">
    <label>سعر كل ولاية (اختياري)</label><div class="dgrid">${WILAYAS.map((w, i) => `<label><span style="flex:1">${i + 1}. ${w}</span><input class="in" data-w="${i + 1}" type="number" inputmode="numeric" value="${esc(d.prices[i + 1] ?? "")}" style="width:80px"></label>`).join("")}</div>
    <button class="btn r full" style="margin-top:16px">حفظ الإعدادات</button></form>
    <form id="pwf" class="glass" style="padding:16px;margin-top:14px"><h3>🔒 تغيير كلمة السر</h3><input class="in" type="password" name="p" minlength="6" autocomplete="new-password" placeholder="6 أحرف على الأقل" style="margin-top:8px"><button class="btn l full" style="margin-top:10px">تغيير</button></form>`;
  $("#setf").onsubmit = async e => {
    e.preventDefault();
    const f = e.target, body = {};
    ["phone", "whatsapp", "facebook", "instagram", "tiktok", "maps", "lat", "lng", "city_ar", "city_fr", "days_ar", "days_fr", "hours_ar", "hours_fr", "announce_ar", "announce_fr"].forEach(k => body[k] = f[k].value);
    const prices = {}; $$("[data-w]").forEach(i => { if (i.value !== "") prices[i.dataset.w] = i.value; });
    body.delivery = { enabled: $("#den").checked, default_price: $("#ddef").value, prices };
    try { await send("/settings", "PUT", body); toast("تم الحفظ ✓"); } catch { toast("خطأ"); }
  };
  $("#pwf").onsubmit = async e => { e.preventDefault(); try { await send("/password", "POST", { password: e.target.p.value }); e.target.reset(); toast("تم تغيير كلمة السر ✓"); } catch { toast("6 أحرف على الأقل"); } };
}

token ? main() : login();
})();
</script>
